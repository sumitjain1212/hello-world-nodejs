name: Build the Node.js project
on:
  workflow_dispatch
jobs:
  job1:
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm install

      # Step 4: Build the project (if applicable)
      - name: Build the project
        run: npm run build || echo "No build step defined"

      # Step 5: Copy artifacts (if applicable)
      - name: Copy artifacts
        run: |
          mkdir -p ${{ github.workspace }}/artifacts
          cp -r dist/* ${{ github.workspace }}/artifacts/ || true

      # Step 6: Upload artifacts
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nodejs-artifacts
          path: ${{ github.workspace }}/artifacts/

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/nodejs-app:latest

      - name: Run Docker container
        run: docker run -d -p 3000:3000 ${{ secrets.DOCKER_USERNAME }}/nodejs-app:latest
